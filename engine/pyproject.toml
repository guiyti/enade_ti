[project]
name = "enade-ti"
version = "1.0.0"
description = "Banco Visual de Questões ENADE de TI com Extração Geométrica e Frontend Next.js"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
# Adiciona engine/ ao sys.path para que imports do tipo "src.enade.*" funcionem
pythonpath = ["."]

[tool.pyright]
# Informa ao IDE (Pylance) que engine/ é raiz de importação
extraPaths = ["."]
pythonVersion = "3.10"
